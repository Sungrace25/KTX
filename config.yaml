# 코레일 계정 정보
korail:
  id: "YOUR_KORAIL_ID"         # 코레일 회원번호(10자리) 또는 이메일
  password: "YOUR_PASSWORD"    # 비밀번호

# 텔레그램 봇 설정
# 1. 텔레그램에서 @BotFather → /newbot → 토큰 발급
# 2. @userinfobot 에 메시지를 보내면 자신의 chat_id 확인 가능
telegram:
  bot_token: "YOUR_BOT_TOKEN"  # 예: "1234567890:ABCdef-..."
  chat_id: "YOUR_CHAT_ID"      # 예: "123456789"

# 열차 검색 조건
search:
  departure: "서울"            # 출발역 (korail 역명 그대로)
  arrival: "부산"              # 도착역
  date: "20261201"             # 출발일 (YYYYMMDD)
  time_from: "0800"            # 조회 시작 시간 (HHMM)
  time_to: "1200"              # 조회 종료 시간 (HHMM) - 이 시각 이후 출발 열차 제외
  train_types:                 # 원하는 열차 종류 (빈 리스트 [] = 전체)
    - "KTX"
    # - "KTX-산천"
    # - "KTX-이음"
  seat_types:                  # general: 일반실 / special: 특실 (복수 지정 가능)
    - "general"
    # - "special"

# 모니터링 설정
monitor:
  interval: 30                 # 조회 간격 (초) ※ 30초 미만은 서버 차단 위험
  auto_reserve: true           # true: 취소표 발견 즉시 자동 예약 / false: 알림만
  stop_after_reserve: true     # 자동 예약 성공 후 모니터링 중단 여부
  max_attempts: 0              # 최대 시도 횟수 (0 = 무제한)
  notify_on_start: true        # 시작 시 텔레그램으로 시작 알림 발송 여부
