name: KTX 취소표 모니터링

on:
  schedule:
    - cron: '*/5 * * * *'   # 5분마다 자동 실행
  workflow_dispatch:          # 수동 실행 버튼

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install korail2 requests pyyaml

      - name: 취소표 확인
        env:
          KORAIL_ID:            ${{ secrets.KORAIL_ID }}
          KORAIL_PASSWORD:      ${{ secrets.KORAIL_PASSWORD }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPARTURE:            ${{ secrets.DEPARTURE }}
          ARRIVAL:              ${{ secrets.ARRIVAL }}
          DATE:                 ${{ secrets.DATE }}
          TIME_FROM:            ${{ secrets.TIME_FROM }}
          TIME_TO:              ${{ secrets.TIME_TO }}
          TRAIN_TYPES:          ${{ secrets.TRAIN_TYPES }}
          SEAT_TYPES:           ${{ secrets.SEAT_TYPES }}
          AUTO_RESERVE:         ${{ secrets.AUTO_RESERVE }}
        run: python ktx_monitor.py
